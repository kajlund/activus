<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" role="img" aria-labelledby="title desc">
  <title id="title">Activus visual design overview</title>
  <desc id="desc">Style board showing the Activus icon, brand personality, colors, typography, controls, and chart palette.</desc>
  <defs>
    <linearGradient id="icon-bg" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#102E2A"/>
      <stop offset="1" stop-color="#17453D"/>
    </linearGradient>
    <linearGradient id="icon-mark" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#55C99A"/>
      <stop offset="1" stop-color="#B7E46C"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="160%">
      <feDropShadow dx="0" dy="8" stdDeviation="14" flood-color="#14231D" flood-opacity=".10"/>
    </filter>
    <style>
      text { font-family: Manrope, system-ui, -apple-system, "Segoe UI", sans-serif; fill: #1C2723; }
      .eyebrow { font-size: 14px; font-weight: 700; letter-spacing: 2px; fill: #66716C; }
      .heading { font-size: 28px; font-weight: 700; }
      .label { font-size: 15px; font-weight: 650; }
      .small { font-size: 13px; font-weight: 500; fill: #66716C; }
      .inverse { fill: #FFFFFF; }
      .inverse-soft { fill: #DCEDE4; }
    </style>
  </defs>

  <rect width="1600" height="1000" fill="#F7F5EF"/>

  <g transform="translate(80 66) scale(.2578125)">
    <path d="M256 42 422 101v123c0 113-62 199-166 246C152 423 90 337 90 224V101z" fill="#512372" stroke="#C4F000" stroke-width="18" stroke-linejoin="round"/>
    <path d="M128 292h49l22-42 31 82 52-181 48 169" fill="none" stroke="#F7F2FA" stroke-width="23" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M248 270h68" fill="none" stroke="#B88ADB" stroke-width="17" stroke-linecap="round"/>
    <path d="m330 320 54-105" fill="none" stroke="#C4F000" stroke-width="23" stroke-linecap="round"/>
    <path d="m357 209 51-31-7 60z" fill="#C4F000"/>
  </g>
  <text x="242" y="113" font-size="54" font-weight="700">Activus</text>
  <text x="244" y="151" font-size="20" fill="#66716C">A calm personal training journal</text>
  <text x="244" y="181" font-size="17" fill="#67318F">Progress without pressure</text>

  <g transform="translate(80 244)">
    <text class="eyebrow">CORE PALETTE</text>
    <g transform="translate(0 34)">
      <rect width="205" height="126" rx="16" fill="#351653"/>
      <text class="inverse" x="18" y="88" font-size="16" font-weight="650">Aubergine</text>
      <text class="inverse-soft" x="18" y="111" font-size="13">#351653</text>
    </g>
    <g transform="translate(221 34)">
      <rect width="205" height="126" rx="16" fill="#67318F"/>
      <text class="inverse" x="18" y="88" font-size="16" font-weight="650">Primary</text>
      <text class="inverse-soft" x="18" y="111" font-size="13">#67318F</text>
    </g>
    <g transform="translate(442 34)">
      <rect width="205" height="126" rx="16" fill="#9BCB3B"/>
      <text x="18" y="88" font-size="16" font-weight="650" fill="#102E2A">Progress</text>
      <text x="18" y="111" font-size="13">#9BCB3B</text>
    </g>
    <g transform="translate(663 34)">
      <rect width="205" height="126" rx="16" fill="#EEE7F4" stroke="#D9DED7"/>
      <text x="18" y="88" font-size="16" font-weight="650">Soft surface</text>
      <text x="18" y="111" font-size="13" fill="#66716C">#EEE7F4</text>
    </g>
    <g transform="translate(884 34)">
      <rect width="205" height="126" rx="16" fill="#F7F5EF" stroke="#D9DED7"/>
      <text x="18" y="88" font-size="16" font-weight="650">Warm canvas</text>
      <text x="18" y="111" font-size="13" fill="#66716C">#F7F5EF</text>
    </g>
  </g>

  <g transform="translate(80 463)">
    <text class="eyebrow">TYPOGRAPHY · MANROPE</text>
    <text x="0" y="77" font-size="34" font-weight="700">Your training, clearly recorded.</text>
    <text x="0" y="118" font-size="20" font-weight="650">Walking distance</text>
    <text x="0" y="153" font-size="15">Four activities · 21.4 km · 3 h 25 min</text>
    <text x="0" y="182" class="small">35 minutes more training than last week</text>

    <g transform="translate(0 224)">
      <rect width="178" height="48" rx="10" fill="#67318F"/>
      <text class="inverse" x="89" y="30" text-anchor="middle" font-size="15" font-weight="700">Record activity</text>
      <rect x="196" width="138" height="48" rx="10" fill="#FFFFFF" stroke="#D9DED7"/>
      <text x="265" y="30" text-anchor="middle" font-size="15" font-weight="650">View details</text>
      <rect x="352" y="5" width="112" height="38" rx="19" fill="#EEE7F4"/>
      <text x="408" y="29" text-anchor="middle" font-size="13" font-weight="650" fill="#512372">Treadmill</text>
    </g>
  </g>

  <g transform="translate(780 463)">
    <text class="eyebrow">PROGRESS, NOT PRESSURE</text>
    <rect y="34" width="740" height="354" rx="20" fill="#FFFFFF" filter="url(#shadow)"/>
    <text x="32" y="82" font-size="20" font-weight="700">Walking distance</text>
    <text x="32" y="112" class="small">Last six months · Outdoor and treadmill</text>
    <text x="682" y="84" text-anchor="end" font-size="26" font-weight="700">214.6 km</text>

    <g transform="translate(42 148)">
      <line x1="0" y1="160" x2="654" y2="160" stroke="#D9DED7"/>
      <line x1="0" y1="106" x2="654" y2="106" stroke="#EFF2EB"/>
      <line x1="0" y1="52" x2="654" y2="52" stroke="#EFF2EB"/>
      <g fill="#DCEDE4">
        <rect x="18" y="79" width="46" height="81" rx="6"/>
        <rect x="126" y="62" width="46" height="98" rx="6"/>
        <rect x="234" y="42" width="46" height="118" rx="6"/>
        <rect x="342" y="68" width="46" height="92" rx="6"/>
        <rect x="450" y="28" width="46" height="132" rx="6"/>
      </g>
      <rect x="558" y="15" width="46" height="145" rx="6" fill="#9BCB3B"/>
      <path d="M41 89 C115 75 141 83 149 76 S233 61 257 57 S341 82 365 72 S446 53 473 45 S562 41 581 30" fill="none" stroke="#67318F" stroke-width="4" stroke-linecap="round"/>
      <line x1="0" y1="48" x2="654" y2="48" stroke="#A76A16" stroke-width="2" stroke-dasharray="7 7"/>
      <g class="small" text-anchor="middle">
        <text x="41" y="190">Apr</text><text x="149" y="190">May</text><text x="257" y="190">Jun</text>
        <text x="365" y="190">Jul</text><text x="473" y="190">Aug</text><text x="581" y="190">Sep</text>
      </g>
    </g>
  </g>

  <g transform="translate(80 882)">
    <text class="eyebrow">CHART PALETTE</text>
    <g transform="translate(0 28)">
      <circle cx="14" cy="14" r="14" fill="#67318F"/><circle cx="58" cy="14" r="14" fill="#527FA5"/>
      <circle cx="102" cy="14" r="14" fill="#A66B3F"/><circle cx="146" cy="14" r="14" fill="#8069A5"/>
      <circle cx="190" cy="14" r="14" fill="#9A7650"/><circle cx="234" cy="14" r="14" fill="#A15467"/>
    </g>
    <text x="330" y="49" font-size="15" fill="#66716C">Warm surfaces · restrained colour · generous spacing · factual language</text>
  </g>
</svg>

